services:
  postgres:
    image: postgres:16-alpine
    container_name: niva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: niva
      POSTGRES_PASSWORD: niva
      POSTGRES_DB: niva
    ports:
      - "5432:5432"
    volumes:
      - niva_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niva -d niva"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: niva-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - niva_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: niva-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: niva
      MINIO_ROOT_PASSWORD: nivalocalpass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - niva_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  niva_postgres:
  niva_redis:
  niva_minio:
