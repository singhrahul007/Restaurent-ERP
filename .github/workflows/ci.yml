name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: niva
          POSTGRES_PASSWORD: niva
          POSTGRES_DB: niva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U niva -d niva"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://niva:niva@localhost:5432/niva
      REDIS_URL: redis://localhost:6379
      CORS_ORIGINS: http://localhost:3000
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: niva
      S3_SECRET_KEY: nivalocalpass
      S3_BUCKET: niva
      S3_FORCE_PATH_STYLE: true
      JWT_ACCESS_SECRET: local-dev-jwt-access-secret-min-32-chars
      COOKIE_SECURE: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
